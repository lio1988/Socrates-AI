name: Build OpenRouter Wire Spec v2 Evidence

on:
  push:
    branches:
      - feature/socrates-zero-openrouter-wire-spec-evidence-v2
    paths:
      - backend/dialogues/socrates_zero/openrouter_wire_spec_manifest_v2.py
      - scripts/build_socrates_zero_openrouter_wire_spec_manifest_v2.py
      - tests_dialogues/test_socrates_zero_openrouter_wire_spec_manifest_v2.py
      - .github/workflows/build-openrouter-wire-spec-v2.yml

permissions:
  contents: write

jobs:
  publish-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CED_ENABLE_LIVE_PROVIDERS: '0'
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/socrates-zero-openrouter-wire-spec-evidence-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prove generated files are absent before write-once publication
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/evidence/openrouter_official_wire_specification_manifest_v2.json
          test ! -e docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_validation_v2.json
          test ! -e docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_revalidation_v2.json

      - name: Publish canonical v2 evidence once
        run: python scripts/build_socrates_zero_openrouter_wire_spec_manifest_v2.py --repository-root .

      - name: Run v1 and v2 focused wire-spec tests
        run: |
          python -m pytest -q \
            tests_dialogues/test_socrates_zero_openrouter_acquisition_wire_spec_evidence_v1_contracts.py \
            tests_dialogues/test_socrates_zero_openrouter_wire_spec_source_acquisition_v1.py \
            tests_dialogues/test_socrates_zero_openrouter_wire_spec_manifest_v1.py \
            tests_dialogues/test_socrates_zero_openrouter_wire_spec_manifest_v2.py

      - name: Verify canonical file hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '7028624f78753b83af29697d79c75ccbd2e3247bf0aada6de37025cad6105082  docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/evidence/openrouter_official_wire_specification_manifest_v2.json' | sha256sum --check --strict
          echo '2e86f708698b20e964a85e432b65cb8772d692a414360a88a9a57502ce593bea  docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_validation_v2.json' | sha256sum --check --strict
          echo '8fa39e234537eeac7420ede7b132879a53448953e8721038281fe6f93bdad5ca  docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_revalidation_v2.json' | sha256sum --check --strict

      - name: Commit exactly the generated evidence files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/evidence/openrouter_official_wire_specification_manifest_v2.json \
            docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_validation_v2.json \
            docs/branches/feature-socrates-zero-openrouter-wire-spec-evidence-v2/artifacts/openrouter_wire_specification_manifest_revalidation_v2.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git commit -m 'docs: publish OpenRouter wire specification evidence v2'
          git push origin HEAD:feature/socrates-zero-openrouter-wire-spec-evidence-v2
