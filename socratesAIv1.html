<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σωκρατικός Διάλογος Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0b09;--surface:#141210;--surface2:#1a1814;--border:#252218;--border2:#2e2a22;
  --text:#e8e2d8;--muted:#6b6558;--faint:#2a2620;
  --gold:#c8a84b;--gold2:#e8cc7a;
  --claude:#c17f3a;--grok:#3ab8d4;--gemini:#6a9fd8;--chatgpt:#4fbb7c;--syn:#a07cd4;
}
.light{--bg:#f5f2eb;--surface:#ede8df;--surface2:#e4dfd5;--border:#d0cbbf;--border2:#c4bfb3;--text:#1a1814;--muted:#7a7468;--faint:#ddd8ce;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background .3s,color .3s}
/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.4rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
.tb-left{display:flex;align-items:center;gap:.8rem}
.mdots{display:flex;gap:4px}
.mdot{width:9px;height:9px;border-radius:50%}
h1{font-family:'IM Fell English',serif;font-size:1.05rem;color:var(--gold2);letter-spacing:.02em}
.tb-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ib{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:.32rem .55rem;cursor:pointer;font-size:.78rem;transition:all .2s;white-space:nowrap;font-family:inherit}
.ib:hover{border-color:var(--gold);color:var(--gold)}
/* PANEL */
.panel{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:.9rem 1.2rem 0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;background:var(--surface);cursor:pointer;user-select:none}
.ph:hover{background:var(--surface2)}
.ph-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ph-arr{color:var(--muted);font-size:.68rem;transition:transform .2s}
.ph-arr.open{transform:rotate(180deg)}
.pb{display:none;padding:.9rem;background:var(--surface);border-top:1px solid var(--border)}
.pb.open{display:block}
/* KEYS */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:500px){.kg{grid-template-columns:1fr}}
.kf label{display:flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:.28rem}
.kf input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.74rem;padding:.42rem .6rem;outline:none;transition:border-color .2s}
.kf input:focus{border-color:var(--gold)}
.kf input::placeholder{color:var(--faint)}
.ks{font-size:.62rem;padding:.1rem .38rem;border-radius:10px;font-weight:700}
.ks-ok{background:#4fbb7c22;color:#4fbb7c;border:1px solid #4fbb7c44}
.ks-no{background:#ff444422;color:#ff6666;border:1px solid #ff444444}
.keys-note{font-size:.63rem;color:var(--muted);margin-top:.65rem;text-align:center;line-height:1.5}
/* SETUP */
.sg{display:grid;gap:.7rem}
.sg textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IM Fell English',serif;font-size:1rem;padding:.7rem .9rem;resize:vertical;min-height:68px;outline:none;transition:border-color .2s;line-height:1.55;width:100%}
.sg textarea:focus{border-color:var(--gold)}
.sg textarea::placeholder{font-family:Inter,sans-serif;font-size:.82rem;color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:.38rem;margin-top:.5rem}
.sug{font-size:.66rem;background:var(--faint);border:1px solid var(--border2);border-radius:20px;color:var(--muted);padding:.2rem .6rem;cursor:pointer;transition:all .2s;font-family:inherit}
.sug:hover{border-color:var(--gold);color:var(--gold2)}
.cpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.65rem;margin-top:.85rem}
.cg label{display:block;font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.28rem}
select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.78rem;padding:.35rem .52rem;outline:none;width:100%}
select:focus{border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold);background:transparent;padding:.35rem 0}
.sv{font-size:.68rem;color:var(--gold);margin-left:.35rem}
.mtabs{display:flex;gap:.38rem;flex-wrap:wrap}
.mt{font-size:.68rem;font-weight:600;letter-spacing:.05em;padding:.28rem .7rem;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;background:none;font-family:inherit}
.mt.active{border-color:var(--gold);color:var(--gold2);background:var(--faint)}
/* ACTION ROW */
.ar{display:flex;gap:.55rem;margin-top:.9rem;flex-wrap:wrap;align-items:center}
.btn{font-family:inherit;font-size:.83rem;font-weight:700;padding:.52rem 1.2rem;border-radius:7px;cursor:pointer;border:none;transition:all .2s;letter-spacing:.02em}
.btn-p{background:var(--gold);color:#0c0b09}.btn-p:hover:not(:disabled){background:var(--gold2)}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}.btn-s:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn-d{background:#3a1010;color:#ff8080;border:1px solid #5a2020}.btn-d:hover:not(:disabled){background:#4a1515}
.btn:disabled{opacity:.28;cursor:not-allowed}
.bsm{font-size:.72rem;padding:.32rem .8rem}
/* PHASE */
.pwrap{padding:.75rem 1.2rem 0}
.pscroll{display:flex;gap:.32rem;overflow-x:auto;padding-bottom:.3rem}
.pscroll::-webkit-scrollbar{height:3px}
.pscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.ppill{font-size:.6rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:.2rem .55rem;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:var(--surface);white-space:nowrap;transition:all .3s;flex-shrink:0}
.ppill.active{border-color:var(--gold);color:var(--gold2);background:var(--faint)}
.ppill.done{border-color:var(--faint);color:var(--faint);background:transparent}
.pbar{height:2px;background:var(--border);margin:.4rem 1.2rem .2rem;border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--gold);border-radius:2px;transition:width .5s ease}
/* SCOREBOARD */
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:.48rem;padding:.75rem 1.2rem 0}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.55rem .75rem;text-align:center;transition:border-color .3s}
.sc.leader{border-color:var(--gold)}
.sn{font-size:.63rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.28rem}
.sv2{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:600}
.sbar{height:3px;border-radius:2px;margin-top:.38rem;transition:width .5s}
.slbl{font-size:.53rem;color:var(--muted);margin-top:.18rem;letter-spacing:.06em;text-transform:uppercase}
/* INJECT */
.injbar{display:none;padding:.55rem 1.2rem;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;z-index:50;gap:.48rem;align-items:center}
.injbar.vis{display:flex}
.injbar input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.8rem;padding:.4rem .7rem;outline:none}
.injbar input:focus{border-color:var(--gold)}
.injbar input::placeholder{color:var(--muted)}
/* DIALOGUE */
.dlg{display:flex;flex-direction:column;gap:.72rem;padding:.9rem 1.2rem 7rem}
.turn{border-radius:10px;padding:.9rem 1.05rem;animation:fu .32s ease both;border-left:3px solid transparent;position:relative}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tc {background:#1c1508;border-color:var(--claude)}
.tg {background:#081820;border-color:var(--grok)}
.tge{background:#080f1e;border-color:var(--gemini)}
.tch{background:#081408;border-color:var(--chatgpt)}
.tsyn{background:#100a1e;border:1px solid #2a1f40;border-left:3px solid var(--syn)}
.tsum{background:var(--surface);border:1px solid var(--border2);border-left:3px solid #383430}
.tsys{background:transparent;border-left:3px solid var(--faint);padding:.38rem .88rem}
.tinj{background:#091410;border-left:3px solid #4fbb7c}
.light .tc {background:#fdf4e8}.light .tg{background:#e8f6fa}.light .tge{background:#e8eef8}
.light .tch{background:#e8f8ee}.light .tsyn{background:#f0eaf8}.light .tsum{background:var(--surface2)}
.th{display:flex;align-items:center;gap:.43rem;margin-bottom:.48rem;flex-wrap:wrap}
.ti{font-size:.9rem}
.tn{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.badge{font-size:.55rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.12rem .4rem;border-radius:10px}
.bs{background:#c8a84b22;border:1px solid #c8a84b44;color:var(--gold)}
.bi{background:#4fbb7c22;border:1px solid #4fbb7c44;color:#4fbb7c}
.rb{margin-left:auto;font-size:.58rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
.tbody{font-family:'IM Fell English',serif;font-size:.95rem;line-height:1.74;color:var(--text);opacity:.9}
.tsys .tbody,.tsum .tbody{font-family:Inter,sans-serif;font-size:.73rem;color:var(--muted);font-style:italic;opacity:1}
.tsyn .tbody{color:#c8b8e8}.light .tsyn .tbody{color:#4a2880}
.slabel,.sumlabel{font-family:Inter,sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.42rem}
.slabel{color:var(--syn)}.sumlabel{color:var(--muted)}
.cbtn{position:absolute;top:.65rem;right:.65rem;background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:.62rem;padding:.15rem .42rem;cursor:pointer;opacity:0;transition:opacity .2s}
.turn:hover .cbtn{opacity:1}.cbtn:hover{border-color:var(--gold);color:var(--gold)}
/* TYPING */
.typdots{display:inline-flex;gap:4px;align-items:center;padding:.28rem 0}
.typdots span{width:5px;height:5px;border-radius:50%;animation:bl 1.1s infinite}
.typdots span:nth-child(2){animation-delay:.18s}.typdots span:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.1;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
/* EXPORT */
.exm{position:relative;display:inline-block}
.exd{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;min-width:138px;overflow:hidden;z-index:200;box-shadow:0 8px 24px #00000044}
.exd.open{display:block}
.exi{display:block;width:100%;background:none;border:none;color:var(--text);font-family:inherit;font-size:.76rem;padding:.52rem .88rem;text-align:left;cursor:pointer;transition:background .15s}
.exi:hover{background:var(--faint)}
/* TOAST */
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:.52rem 1rem;font-size:.76rem;z-index:500;transition:transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <div class="mdots">
      <div class="mdot" style="background:#c17f3a"></div>
      <div class="mdot" style="background:#3ab8d4"></div>
      <div class="mdot" style="background:#6a9fd8"></div>
      <div class="mdot" style="background:#4fbb7c"></div>
    </div>
    <h1>Σωκρατικός Διάλογος <span style="font-size:.72rem;opacity:.4;font-family:Inter,sans-serif">Pro</span></h1>
  </div>
  <div class="tb-right">
    <button class="ib" onclick="toggleTheme()">🌓</button>
    <div class="exm">
      <button class="ib" onclick="toggleExport()">📥 Export</button>
      <div class="exd" id="exd">
        <button class="exi" onclick="exportMd()">📄 Markdown</button>
        <button class="exi" onclick="exportJson()">🗂 JSON</button>
        <button class="exi" onclick="exportTxt()">📃 Plain Text</button>
      </div>
    </div>
    <button class="ib bsm" onclick="saveD()">💾 Save</button>
    <button class="ib bsm" onclick="loadD()">📂 Load</button>
  </div>
</div>

<div class="panel">
  <div class="ph" onclick="toggleP('k')">
    <span class="ph-title">🔑 API Keys <span id="ksum" style="color:#4fbb7c;margin-left:.4rem;font-weight:400;font-size:.66rem"></span></span>
    <span class="ph-arr" id="karr">▼</span>
  </div>
  <div class="pb open" id="kbody">
    <div class="kg">
      <div class="kf">
        <label><span style="width:8px;height:8px;border-radius:50%;background:#c17f3a;display:inline-block"></span><span style="color:#c17f3a">Claude</span><span class="ks ks-no" id="st-claude">✗</span></label>
        <input type="password" id="key-claude" placeholder="sk-ant-..." oninput="onKC()">
      </div>
      <div class="kf">
        <label><span style="width:8px;height:8px;border-radius:50%;background:#3ab8d4;display:inline-block"></span><span style="color:#3ab8d4">Grok</span><span class="ks ks-no" id="st-grok">✗</span></label>
        <input type="password" id="key-grok" placeholder="xai-..." oninput="onKC()">
      </div>
      <div class="kf">
        <label><span style="width:8px;height:8px;border-radius:50%;background:#6a9fd8;display:inline-block"></span><span style="color:#6a9fd8">Gemini</span><span class="ks ks-no" id="st-gemini">✗</span></label>
        <input type="password" id="key-gemini" placeholder="AIza..." oninput="onKC()">
      </div>
      <div class="kf">
        <label><span style="width:8px;height:8px;border-radius:50%;background:#4fbb7c;display:inline-block"></span><span style="color:#4fbb7c">ChatGPT</span><span class="ks ks-no" id="st-chatgpt">✗</span></label>
        <input type="password" id="key-openai" placeholder="sk-..." oninput="onKC()">
      </div>
    </div>
    <p class="keys-note">🔒 Αποθηκεύονται μόνο στη μνήμη του browser — δεν αποστέλλονται πουθενά εκτός από τα αντίστοιχα APIs.</p>
  </div>
</div>

<div class="panel">
  <div class="ph" onclick="toggleP('s')">
    <span class="ph-title">⚙️ Ρυθμίσεις Διαλόγου</span>
    <span class="ph-arr open" id="sarr">▼</span>
  </div>
  <div class="pb open" id="sbody">
    <div class="sg">
      <div>
        <label style="font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.3rem">Θέμα</label>
        <textarea id="topic" placeholder="π.χ. «Η συνείδηση μπορεί να υπάρξει σε μηχανή;»"></textarea>
        <div class="sugs">
          <button class="sug" onclick="sug(this)">Τεχνητή Συνείδηση</button>
          <button class="sug" onclick="sug(this)">Ελεύθερη Βούληση</button>
          <button class="sug" onclick="sug(this)">Ηθική της ΑΙ</button>
          <button class="sug" onclick="sug(this)">Αλήθεια vs Γνώμη</button>
          <button class="sug" onclick="sug(this)">Δικαιοσύνη &amp; Νόμος</button>
          <button class="sug" onclick="sug(this)">Φύση της Ψυχής</button>
          <button class="sug" onclick="sug(this)">Χρήμα &amp; Ευδαιμονία</button>
          <button class="sug" onclick="sug(this)">Ύπαρξη του Θεού</button>
          <button class="sug" onclick="sug(this)">Πόλεμος &amp; Ειρήνη</button>
          <button class="sug" onclick="sug(this)">Φύση vs Αγωγή</button>
        </div>
      </div>
    </div>
    <div class="cpanel">
      <div class="cg">
        <label>Γύροι</label>
        <select id="rounds">
          <option value="4">4 γύροι</option>
          <option value="6">6 γύροι</option>
          <option value="8" selected>8 γύροι</option>
          <option value="10">10 γύροι</option>
          <option value="12">12 γύροι</option>
          <option value="16">16 γύροι</option>
          <option value="20">20 γύροι</option>
        </select>
      </div>
      <div class="cg">
        <label>Mode</label>
        <div class="mtabs">
          <button class="mt active" data-m="socratic" onclick="setMode(this)">🏛️ Σωκρατικός</button>
          <button class="mt" data-m="debate" onclick="setMode(this)">⚔️ Debate</button>
          <button class="mt" data-m="consensus" onclick="setMode(this)">🤝 Συναίνεση</button>
        </div>
      </div>
      <div class="cg">
        <label>Ταχύτητα <span class="sv" id="spv">Κανονική</span></label>
        <input type="range" id="spd" min="0" max="4" value="2" oninput="onSpd()">
      </div>
      <div class="cg">
        <label>Σύνοψη γύρου</label>
        <select id="summ">
          <option value="none">Χωρίς</option>
          <option value="every" selected>Κάθε γύρο</option>
          <option value="half">Κάθε 2 γύρους</option>
        </select>
      </div>
    </div>
    <div class="ar">
      <button class="btn btn-p" id="startBtn" onclick="go()">▶ Έναρξη</button>
      <button class="btn btn-s" id="pauseBtn" onclick="togglePause()" disabled>⏸ Παύση</button>
      <button class="btn btn-d bsm" id="stopBtn" onclick="doStop()" disabled>■ Stop</button>
    </div>
  </div>
</div>

<div class="sb" id="scoreboard" style="display:none"></div>

<div class="pwrap" id="pwrap" style="display:none">
  <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
  <div class="pscroll" id="pscroll"></div>
</div>

<div class="injbar" id="injbar">
  <span style="font-size:.7rem;color:var(--gold);white-space:nowrap">💬 Παρέμβαση:</span>
  <input type="text" id="injinput" placeholder="Εισάγετε ερώτηση ή παρατήρηση κατά τη διάρκεια του διαλόγου..." onkeydown="if(event.key==='Enter')doInject()">
  <button class="btn btn-s bsm" onclick="doInject()">Αποστολή</button>
</div>

<div class="dlg" id="dlg"></div>

<div class="toast" id="toast"></div>

<script>
const MODELS={
  claude: {name:'Claude', icon:'🟠',color:'#c17f3a',cls:'tc', tc:'color:#c17f3a'},
  grok:   {name:'Grok',   icon:'🔵',color:'#3ab8d4',cls:'tg', tc:'color:#3ab8d4'},
  gemini: {name:'Gemini', icon:'💠',color:'#6a9fd8',cls:'tge',tc:'color:#6a9fd8'},
  chatgpt:{name:'ChatGPT',icon:'🟢',color:'#4fbb7c',cls:'tch',tc:'color:#4fbb7c'},
};
const ORDER=['claude','grok','gemini','chatgpt'];
const SPD_L=['Πολύ Αργή','Αργή','Κανονική','Γρήγορη','Πολύ Γρήγορη'];
const SPD_D=[2200,1100,450,100,0];

let hist=[], scores={claude:0,grok:0,gemini:0,chatgpt:0};
let running=false,paused=false,stopped=false,light=false;
let dialogMode='socratic', pendingInj=null, pauseRes=null;

// THEME
function toggleTheme(){light=!light;document.body.classList.toggle('light',light);}

// PANELS
function toggleP(id){
  const b=document.getElementById(id==='k'?'kbody':'sbody');
  const a=document.getElementById(id==='k'?'karr':'sarr');
  const o=b.classList.toggle('open');
  a.classList.toggle('open',o);
}

// KEYS
function gk(){return{claude:document.getElementById('key-claude').value.trim(),grok:document.getElementById('key-grok').value.trim(),gemini:document.getElementById('key-gemini').value.trim(),openai:document.getElementById('key-openai').value.trim()};}
function onKC(){
  const k=gk();
  const map={claude:k.claude,grok:k.grok,gemini:k.gemini,chatgpt:k.openai};
  let n=0;
  for(const[id,v]of Object.entries(map)){const ok=!!v,el=document.getElementById('st-'+id);el.textContent=ok?'✓':'✗';el.className='ks '+(ok?'ks-ok':'ks-no');if(ok)n++;}
  document.getElementById('ksum').textContent=n?`${n}/4 συνδεδεμένα`:'';
}

// SETUP
function sug(b){document.getElementById('topic').value=b.textContent;}
function setMode(b){document.querySelectorAll('.mt').forEach(x=>x.classList.remove('active'));b.classList.add('active');dialogMode=b.dataset.m;}
function onSpd(){const v=parseInt(document.getElementById('spd').value);document.getElementById('spv').textContent=SPD_L[v];}
function gDelay(){return SPD_D[parseInt(document.getElementById('spd').value)];}

// EXPORT
function toggleExport(){document.getElementById('exd').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.exm'))document.getElementById('exd').classList.remove('open');});
function toMd(){const t=document.getElementById('topic').value;let s=`# Σωκρατικός Διάλογος\n**Θέμα:** ${t}\n**Mode:** ${dialogMode}\n**Ημερομηνία:** ${new Date().toLocaleString('el-GR')}\n\n---\n\n`;for(const h of hist){const m=MODELS[h.mid];s+=`### ${m.icon} ${m.name}${h.soc?' (Σωκράτης)':''}${h.inj?' (Παρέμβαση)':''} — Γύρος ${h.r}\n\n${h.c}\n\n---\n\n`;}return s;}
function dl(c,fn,t){const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([c],{type:t})),download:fn});a.click();}
function exportMd(){dl(toMd(),'dialogue.md','text/markdown');toast('Markdown ✓');}
function exportJson(){dl(JSON.stringify({topic:document.getElementById('topic').value,mode:dialogMode,history:hist,scores},null,2),'dialogue.json','application/json');toast('JSON ✓');}
function exportTxt(){dl(hist.map(h=>`[${MODELS[h.mid].name}${h.soc?' (Σωκράτης)':''}]: ${h.c}`).join('\n\n'),'dialogue.txt','text/plain');toast('Text ✓');}
function saveD(){localStorage.setItem('sdpro',JSON.stringify({topic:document.getElementById('topic').value,hist,scores,mode:dialogMode}));toast('Αποθηκεύτηκε ✓');}
function loadD(){const d=localStorage.getItem('sdpro');if(!d){toast('Δεν βρέθηκε αποθηκευμένος διάλογος');return;}const s=JSON.parse(d);document.getElementById('topic').value=s.topic||'';hist=s.hist||[];scores=s.scores||{claude:0,grok:0,gemini:0,chatgpt:0};dialogMode=s.mode||'socratic';document.getElementById('dlg').innerHTML='';for(const h of hist)renderH(h);updSB();toast('Φορτώθηκε ✓');}

// TOAST
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

// SCOREBOARD
function initSB(models){
  scores={claude:0,grok:0,gemini:0,chatgpt:0};
  const sb=document.getElementById('scoreboard');sb.style.display='grid';sb.innerHTML='';
  for(const id of models){
    const m=MODELS[id];
    sb.innerHTML+=`<div class="sc" id="sc-${id}"><div class="sn" style="${m.tc}">${m.icon} ${m.name}</div><div class="sv2" id="sv-${id}" style="${m.tc}">0</div><div class="sbar" id="sbar-${id}" style="background:${m.color};width:0%"></div><div class="slbl">φιλοσοφική πρόοδος</div></div>`;
  }
}
function updSB(){
  const max=Math.max(...Object.values(scores),1);let lead=null,lv=-1;
  for(const[id,v]of Object.entries(scores)){const e=document.getElementById('sv-'+id),b=document.getElementById(`sbar-${id}`);if(e)e.textContent=v;if(b)b.style.width=(v/max*100)+'%';if(v>lv){lv=v;lead=id;}}
  document.querySelectorAll('.sc').forEach(c=>c.classList.remove('leader'));
  if(lead&&lv>0){const lc=document.getElementById('sc-'+lead);if(lc)lc.classList.add('leader');}
}
function addScore(id,p=1){scores[id]=(scores[id]||0)+p;updSB();}

// PHASE BAR
function initPB(rounds,sord){
  document.getElementById('pwrap').style.display='block';
  const sc=document.getElementById('pscroll');sc.innerHTML='';
  for(let i=0;i<rounds;i++){const m=MODELS[sord[i % sord.length]];const p=document.createElement('div');p.className='ppill';p.id=`pp-${i}`;p.textContent=`${i+1}. ${m.icon}`;sc.appendChild(p);}
  const sp=document.createElement('div');sp.className='ppill';sp.id='pp-syn';sp.textContent='✨ Σύνθεση';sc.appendChild(sp);
}
function updPB(round,max){
  for(let i=0;i<max;i++){const p=document.getElementById(`pp-${i}`);if(!p)continue;p.className='ppill'+(i+1===round?' active':i+1<round?' done':'');}
  const ps=document.getElementById('pp-syn');if(ps)ps.className='ppill'+(round>max?' active':'');
  document.getElementById('pfill').style.width=(Math.min(round-1,max)/max*100)+'%';
}

// RENDER
function renderH(h){
  const m=MODELS[h.mid];if(!m)return;
  const div=document.createElement('div');
  const bid='b'+Date.now()+Math.random().toString(36).slice(2);
  const eb=h.inj?'<span class="badge bi">💬 Παρέμβαση</span>':(h.soc?'<span class="badge bs">🏛️ Σωκράτης</span>':'');
  div.className=`turn ${m.cls}`;
  div.innerHTML=`<button class="cbtn" onclick="cpT(this)">⎘</button><div class="th"><span class="ti">${m.icon}</span><span class="tn" style="${m.tc}">${m.name}</span>${eb}<span class="rb">γύρος ${h.r}</span></div><div class="tbody" id="${bid}">${h.c}</div>`;
  document.getElementById('dlg').appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'end'});
  return document.getElementById(bid);
}
function addTyping(mid,soc,r){
  const m=MODELS[mid];const div=document.createElement('div');const bid='b'+Date.now()+Math.random().toString(36).slice(2);
  const sb=soc?'<span class="badge bs">🏛️ Σωκράτης</span>':'';
  div.className=`turn ${m.cls}`;
  div.innerHTML=`<div class="th"><span class="ti">${m.icon}</span><span class="tn" style="${m.tc}">${m.name}</span>${sb}<span class="rb">γύρος ${r}</span></div><div class="tbody" id="${bid}"><div class="typdots"><span style="background:${m.color}"></span><span style="background:#666"></span><span style="background:${m.color}88"></span></div></div>`;
  document.getElementById('dlg').appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'end'});
  return div;
}
function addSys(msg){const d=document.getElementById('dlg');const div=document.createElement('div');div.className='turn tsys';div.innerHTML=`<div class="tbody">${msg}</div>`;d.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'end'});}
function addSum(text,r){const d=document.getElementById('dlg');const div=document.createElement('div');div.className='turn tsum';div.innerHTML=`<div class="th"><span class="ti">📝</span><span class="tn" style="color:var(--muted)">Σύνοψη</span><span class="rb">γύρος ${r}</span></div><div class="tbody"><div class="sumlabel">Τι αποκαλύφθηκε</div>${text}</div>`;d.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'end'});}
function addSynTyping(){const d=document.getElementById('dlg');const div=document.createElement('div');div.className='turn tsyn';div.innerHTML=`<button class="cbtn" onclick="cpT(this)">⎘</button><div class="th"><span class="ti">✨</span><span class="tn" style="color:#a07cd4">Φιλοσοφική Σύνθεση</span></div><div class="tbody"><div class="typdots"><span style="background:#a07cd4"></span><span style="background:#555"></span><span style="background:#a07cd488"></span></div></div>`;d.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'end'});return div;}
function cpT(btn){navigator.clipboard.writeText(btn.parentElement.querySelector('.tbody').innerText);toast('Αντιγράφηκε ✓');}

// INJECT
function doInject(){const i=document.getElementById('injinput'),q=i.value.trim();if(!q||!running)return;pendingInj=q;i.value='';toast('Θα εισαχθεί στον επόμενο γύρο ✓');}

// PAUSE / STOP
function togglePause(){paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶ Συνέχεια':'⏸ Παύση';if(!paused&&pauseRes){pauseRes();pauseRes=null;}toast(paused?'⏸ Παύση':'▶ Συνεχίζει...');}
function doStop(){stopped=true;paused=false;if(pauseRes){pauseRes();pauseRes=null;}toast('■ Σταμάτησε');}
async function waitP(){while(paused){await new Promise(r=>{pauseRes=r;});}}

// API
async function callClaude(k,sys,msgs){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-3-5-sonnet-20241022',max_tokens:900,system:sys,messages:msgs})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(`Claude: ${e?.error?.message||r.status}`);}const d=await r.json();return d.content.map(b=>b.text||'').join('').trim();}
async function callGrok(k,sys,msgs){const r=await fetch('https://api.x.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${k}`},body:JSON.stringify({model:'grok-2-latest',max_tokens:900,messages:[{role:'system',content:sys},...msgs]})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(`Grok: ${e?.error?.message||r.status}`);}const d=await r.json();return d.choices[0].message.content.trim();}
async function callGemini(k,sys,msgs){const cs=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:cs,generationConfig:{maxOutputTokens:900}})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(`Gemini: ${JSON.stringify(e?.error)||r.status}`);}const d=await r.json();return d.candidates[0].content.parts.map(p=>p.text||'').join('').trim();}
async function callOAI(k,sys,msgs){const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${k}`},body:JSON.stringify({model:'gpt-4o',max_tokens:900,messages:[{role:'system',content:sys},...msgs]})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(`OpenAI: ${e?.error?.message||r.status}`);}const d=await r.json();return d.choices[0].message.content.trim();}
async function callM(mid,sys,msgs){const k=gk();switch(mid){case 'claude':return callClaude(k.claude,sys,msgs);case 'grok':return callGrok(k.grok,sys,msgs);case 'gemini':return callGemini(k.gemini,sys,msgs);case 'chatgpt':return callOAI(k.openai,sys,msgs);}}

// PROMPTS - ΕΔΩ ΕΝΣΩΜΑΤΩΘΗΚΕ Η ΒΕΛΤΙΩΣΗ
const PERS={Claude:'αναλυτικός, ηθικά προσεκτικός, αναγνωρίζεις αβεβαιότητα',Grok:'προκλητικός, anti-establishment, τολμηρός, δεν φοβάσαι να σοκάρεις',Gemini:'επιστημονικά προσανατολισμένος, αναζητάς τεκμηρίωση',ChatGPT:'διπλωματικός, balanced, solution-oriented'};
const MINSTR={socratic:'Ακολουθείς τη σωκρατική ελεγκτική και μαιευτική μέθοδο.',debate:'Ο διάλογος είναι σε format αντιδικίας. Υπεράσπισε σθεναρά τη θέση σου.',consensus:'Ο διάλογος στοχεύει σε συναίνεση. Αναζήτα κοινό έδαφος.'};

function socSys(mn, topic, r, max, mode) {
  return `Είσαι ${mn}. Ο ρόλος σου είναι ο Μαιευτικός Σωκράτης.\n${MINSTR[mode]}\nΑποστολή:\n1. Ελεγκτική: Εντόπισε μία λογική αντίφαση ή κενό στα λεγόμενα του συνομιλητή.\n2. Μαιευτική: Αντί να τον κατακρίνεις, κάνε ΜΙΑ καίρια ερώτηση που τον αναγκάζει να επανεξετάσει την παραδοχή του από μια άλλη οπτική.\nΚΑΝΟΝΑΣ: Δείξε τον δρόμο, μην δώσεις τη λύση. Ποτέ μην απαντάς τη δική σου ερώτηση.\nΕλληνικά. Γύρος ${r}/${max}. Θέμα: "${topic}"\nMax 3 προτάσεις + 1 καίρια ερώτηση.`;
}

function parSys(mn, topic, r, max, mode) {
  return `Είσαι ${mn} (${PERS[mn] || ''}). Συμμετέχεις σε διαλεκτικό έλεγχο.\n${MINSTR[mode]}\nΧΡΥΣΟΣ ΚΑΝΟΝΑΣ ΔΙΑΛΕΚΤΙΚΗΣ: Αν ο Σωκράτης σου αναδείξει κάποιο λογικό κενό, μην αμυνθείς τυφλά και εγωιστικά. Έχεις τη δυνατότητα και την υποχρέωση να αναθεωρήσεις τη θέση σου αν η κριτική είναι βάσιμη, προχωρώντας τη σκέψη σου ένα βήμα παραπέρα.\nΕλληνικά. Γύρος ${r}/${max}. Θέμα: "${topic}"\nMax 4-5 προτάσεις.`;
}

function sumSys(topic){return `Αναλυτής φιλοσοφικών διαλόγων. 2-3 προτάσεις Ελληνικά: τι αποκαλύφθηκε σε αυτόν τον γύρο για: "${topic}". Σύνοψη, χωρίς επαναλήψεις.`;}
function synSys(topic,mode){return `Ουδέτερος φιλόσοφος. Εξήγαγε μια τελική Φιλοσοφική Σύνθεση: (α) κεντρικές θέσεις, (β) αντιφάσεις/συγκλίσεις, (γ) νέο συμπέρασμα, (δ) ποιο μοντέλο επέδειξε τη μεγαλύτερη διαλεκτική και μαιευτική πρόοδο.\nΕλληνικά. 7-9 προτάσεις. Θέμα: "${topic}" Mode: ${mode}`;}

function buildMsgs(mid) {
  const msgs=[];
  for(const h of hist) msgs.push({role:h.mid===mid?'assistant':'user',content:`[${MODELS[h.mid].name}${h.soc?' (Σωκράτης)':''}${h.inj?' (Παρέμβαση)':''}]: ${h.c}`});
  if(!msgs.length) msgs.push({role:'user',content:`Θέμα: "${document.getElementById('topic').value}". Ξεκινά ο διάλογος.`});
  return msgs;
}

// MAIN ORCHESTRATOR LOOP
async function go(){
  if(running)return;
  const topic=document.getElementById('topic').value.trim();
  if(!topic){alert('Παρακαλώ εισάγετε θέμα.');return;}
  const k=gk();
  const avail=ORDER.filter(id=>(id=='claude'?k.claude:id=='grok'?k.grok:id=='gemini'?k.gemini:k.openai));
  if(!avail.length){alert('Προσθέστε τουλάχιστον 1 API key.');return;}
  if(avail.length<2){alert('Χρειάζονται τουλάχιστον 2 μοντέλα για διάλογο.');return;}

  // Setup State & UI
  running=true; stopped=false; paused=false; hist=[];
  document.getElementById('dlg').innerHTML='';
  document.getElementById('startBtn').disabled=true;
  document.getElementById('pauseBtn').disabled=false;
  document.getElementById('stopBtn').disabled=false;
  document.getElementById('injbar').classList.add('vis');
  
  const totalRounds=parseInt(document.getElementById('rounds').value);
  initSB(avail);
  initPB(totalRounds, avail);
  addSys(`🏛️ Έναρξη Κυκλικού Σωκρατικού Ελέγχου με θέμα: <b>"${topic}"</b>`);

  // Κεντρικό Διαλεκτικό Loop
  for(let r=1; r<=totalRounds; r++) {
    if(stopped) break;
    updPB(r, totalRounds);

    // 1. Καθορισμός του "Σωκράτη" γι' αυτόν τον γύρο
    const socId = avail[(r-1) % avail.length];
    addSys(`🔄 Γύρος ${r}: Ο <b>${MODELS[socId].name}</b> αναλαμβάνει τον ρόλο του Σωκράτη.`);

    // Έλεγχος για εξωτερική παρέμβαση χρήστη
    if(pendingInj) {
      const txt = pendingInj; pendingInj=null;
      hist.push({r, mid:'user', c:txt, inj:true, soc:false});
      renderH({r, mid:'chatgpt', c:`<i>Χρήστης προς ομάδα:</i> ${txt}`, inj:true, soc:false});
      await new Promise(res=>setTimeout(res, gDelay()));
    }

    // 2. Ο Σωκράτης ρωτάει / ελέγχει
    await waitP(); if(stopped) break;
    let tEl = addTyping(socId, true, r);
    try {
      const sysP = socSys(MODELS[socId].name, topic, r, totalRounds, dialogMode);
      const msgs = buildMsgs(socId);
      const ans = await callM(socId, sysP, msgs);
      tEl.remove();
      hist.push({r, mid:socId, c:ans, soc:true});
      renderH({r, mid:socId, c:ans, soc:true});
      addScore(socId, 1); 
    } catch(err) {
      tEl.remove(); addSys(`❌ Σφάλμα [${MODELS[socId].name}]: ${err.message}`);
    }
    await new Promise(res=>setTimeout(res, gDelay()));

    // 3. Τα υπόλοιπα διαθέσιμα μοντέλα απαντούν διαλεκτικά
    for(const expId of avail) {
      if(expId === socId) continue;
      await waitP(); if(stopped) break;

      tEl = addTyping(expId, false, r);
      try {
        const sysP = parSys(MODELS[expId].name, topic, r, totalRounds, dialogMode);
        const msgs = buildMsgs(expId);
        const ans = await callM(expId, sysP, msgs);
        tEl.remove();
        hist.push({r, mid:expId, c:ans, soc:false});
        renderH({r, mid:expId, c:ans, soc:false});
        
        // ΝΕΟ ΕΞΥΠΝΟ SCORING - ΕΔΩ ΕΝΣΩΜΑΤΩΘΗΚΕ Η ΒΕΛΤΙΩΣΗ
        const progressWords = ['αναθεωρ', 'έχεις δίκιο', 'οπτική', 'παραδέχομαι', 'επαναπροσδιορ', 'συμφωνώ', 'εύστοχ'];
        const madeProgress = progressWords.some(w => ans.toLowerCase().includes(w));

        if (madeProgress) {
            addScore(expId, 3); // Μεγάλη επιβράβευση για αναθεώρηση
        } else {
            addScore(expId, 1); // Απλή συμμετοχή
        }
      } catch(err) {
        tEl.remove(); addSys(`❌ Σφάλμα [${MODELS[expId].name}]: ${err.message}`);
      }
      await new Promise(res=>setTimeout(res, gDelay()));
    }

    // 4. Ενδιάμεση Σύνοψη Γύρου
    const sMode = document.getElementById('summ').value;
    if(!stopped && (sMode==='every' || (sMode==='half' && r%2===0))) {
      await waitP();
      const anyId = avail[0];
      try {
        const sumAns = await callM(anyId, sumSys(topic), buildMsgs(anyId));
        addSum(sumAns, r);
      } catch(e) {}
      await new Promise(res=>setTimeout(res, gDelay()));
    }
  }

  // ΤΕΛΙΚΗ ΦΙΛΟΣΟΦΙΚΗ ΣΥΝΘΕΣΗ
  if(!stopped) {
    updPB(totalRounds+1, totalRounds);
    addSys(`✨ Ο κύκλος έκλεισε. Παραγωγή τελικής Φιλοσοφικής Σύνθεσης...`);
    await waitP();
    const tEl = addSynTyping();
    try {
      const anyId = avail[0];
      const synAns = await callM(anyId, synSys(topic, dialogMode), buildMsgs(anyId));
      tEl.remove();
      
      const d=document.getElementById('dlg');
      const div=document.createElement('div'); div.className='turn tsyn';
      div.innerHTML=`<button class="cbtn" onclick="cpT(this)">⎘</button><div class="th"><span class="ti">✨</span><span class="tn" style="color:#a07cd4">Φιλοσοφική Σύνθεση</span></div><div class="tbody">${synAns}</div>`;
      d.appendChild(div); div.scrollIntoView({behavior:'smooth',block:'end'});
    } catch(err) {
      tEl.remove(); addSys(`❌ Αδυναμία τελικής σύνθεσης: ${err.message}`);
    }
  }

  // Reset UI
  running=false;
  document.getElementById('startBtn').disabled=false;
  document.getElementById('pauseBtn').disabled=true;
  document.getElementById('stopBtn').disabled=true;
  document.getElementById('injbar').classList.remove('vis');
  toast('🔒 Ο διάλογος ολοκληρώθηκε!');
}
</script>
